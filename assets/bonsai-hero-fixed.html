<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050606">
<title>BonsAI Studio — animowane hero</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050606; }
  body { font-family: Inter, Arial, sans-serif; }

  .bonsai-hero {
    position: relative;
    isolation: isolate;
    width: 100%;
    aspect-ratio: 1672 / 941;
    overflow: hidden;
    background: #050606;
    color: #fff;
    contain: layout paint style;
  }

  .bonsai-hero__image,
  .bonsai-hero__overlay,
  .bonsai-hero__veins,
  .bonsai-hero__particles,
  .bonsai-hero__vignette {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .bonsai-hero__image {
    display: block;
    object-fit: fill;
    user-select: none;
    pointer-events: none;
  }

  .bonsai-hero__overlay { z-index: 2; pointer-events: none; }

  .bonsai-hero__rings {
    position: absolute;
    left: 47.8%;
    top: 4.4%;
    width: 47.5%;
    height: 89%;
    z-index: 1;
    pointer-events: none;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 10px rgba(249,204,85,.12));
  }

  .bonsai-hero__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(243,201,85,.08);
    opacity: .68;
  }
  .bonsai-hero__ring::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg,
      transparent 0deg 30deg,
      rgba(255,214,99,.74) 30deg 35deg,
      transparent 35deg 114deg,
      rgba(255,214,99,.22) 114deg 124deg,
      transparent 124deg 221deg,
      rgba(255,214,99,.48) 221deg 231deg,
      transparent 231deg 317deg,
      rgba(255,214,99,.28) 317deg 323deg,
      transparent 323deg 360deg);
    -webkit-mask: radial-gradient(circle, transparent calc(100% - 2.4px), #000 calc(100% - 1.4px));
            mask: radial-gradient(circle, transparent calc(100% - 2.4px), #000 calc(100% - 1.4px));
    animation: bonsai-spin var(--duration) linear infinite;
  }
  .bonsai-hero__ring--2 { inset: 5.8%; opacity: .54; }
  .bonsai-hero__ring--2::before { animation-direction: reverse; }
  .bonsai-hero__ring--3 { inset: 10.7%; opacity: .36; }
  .bonsai-hero__ring--4 { inset: 16.8%; opacity: .20; }
  .bonsai-hero__ring--4::before { animation-direction: reverse; }

  .bonsai-hero__veins { z-index: 3; overflow: visible; mix-blend-mode: screen; }
  .bonsai-flow-base, .bonsai-flow-stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bonsai-flow-base { stroke: rgba(244,197,76,.055); }
  .bonsai-flow-stroke {
    stroke: url(#bns-pulse);
    stroke-dasharray: 10 88;
    animation: bonsai-dash var(--speed, 6.4s) linear infinite;
    opacity: .76;
  }
  .bonsai-main { stroke-width: 6; }
  .bonsai-mid { stroke-width: 3.6; }
  .bonsai-small { stroke-width: 2.4; }
  .bonsai-energy-dot { fill: #ffe18d; filter: url(#bns-glow-strong); opacity: .92; }
  .bonsai-energy-faint { fill: #f6c657; filter: url(#bns-glow-soft); opacity: .64; }

  .bonsai-hero__particles { z-index: 4; pointer-events: none; mix-blend-mode: screen; }
  .bonsai-particle {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: rgba(255,221,126,.75);
    box-shadow: 0 0 8px rgba(255,211,97,.50);
    opacity: 0;
    animation: bonsai-float var(--duration) linear infinite;
    animation-delay: var(--delay);
  }
  .bonsai-hero__vignette {
    z-index: 5;
    pointer-events: none;
    background:
      radial-gradient(circle at 73% 43%, rgba(255,224,130,.05), transparent 17%),
      linear-gradient(90deg, transparent, rgba(0,0,0,.08));
    mix-blend-mode: screen;
  }

  .bonsai-hero__toggle {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 10;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,212,104,.32);
    border-radius: 50%;
    background: rgba(3,5,4,.56);
    color: #f7df9b;
    backdrop-filter: blur(8px);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .bonsai-hero__toggle:focus-visible { outline: 2px solid #ffd66f; outline-offset: 3px; }

  .bonsai-hero[data-paused="true"] *,
  .bonsai-hero.is-offscreen * { animation-play-state: paused !important; }

  @keyframes bonsai-spin { to { transform: rotate(360deg); } }
  @keyframes bonsai-dash { to { stroke-dashoffset: -196; } }
  @keyframes bonsai-float {
    0% { transform: translate3d(0,18px,0) scale(.75); opacity: 0; }
    20% { opacity: .34; }
    100% { transform: translate3d(var(--drift),-82px,0) scale(1.1); opacity: 0; }
  }

  @media (max-width: 700px) {
    .bonsai-hero__toggle { width: 38px; height: 38px; right: 8px; bottom: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bonsai-hero__ring { --duration: 60s !important; }
    .bonsai-hero__pulse { --speed: 12s !important; opacity: .42; }
    .bonsai-hero__particles { opacity: .3; }
  }
</style>
</head>

<script>
(() => {
  const root = document.querySelector('[data-bonsai-hero]');
  if (!root) return;

  const reduceMotion = false;
  const particleBox = root.querySelector('[data-bonsai-particles]');
  if (!reduceMotion && particleBox) {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 10; i += 1) {
      const p = document.createElement('span');
      p.className = 'bonsai-particle';
      p.style.left = `${58 + Math.random() * 20}%`;
      p.style.top = `${52 + Math.random() * 22}%`;
      p.style.setProperty('--duration', `${5.8 + Math.random() * 3.2}s`);
      p.style.setProperty('--delay', `${-Math.random() * 7}s`);
      p.style.setProperty('--drift', `${-12 + Math.random() * 24}px`);
      fragment.appendChild(p);
    }
    particleBox.appendChild(fragment);
  }

  const toggle = root.querySelector('[data-bonsai-toggle]');
  toggle?.addEventListener('click', () => {
    const paused = root.dataset.paused !== 'true';
    root.dataset.paused = String(paused);
    toggle.setAttribute('aria-pressed', String(paused));
    toggle.setAttribute('aria-label', paused ? 'Wznów animację' : 'Zatrzymaj animację');
    toggle.textContent = paused ? '▶' : 'Ⅱ';
    const svg = root.querySelector('svg');
    if (svg && typeof svg.pauseAnimations === 'function' && typeof svg.unpauseAnimations === 'function') {
      paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    }
  });

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(([entry]) => {
      root.classList.toggle('is-offscreen', !entry.isIntersecting);
      const svg = root.querySelector('svg');
      if (svg && typeof svg.pauseAnimations === 'function' && typeof svg.unpauseAnimations === 'function') {
        if (!entry.isIntersecting) svg.pauseAnimations();
        else if (root.dataset.paused !== 'true') svg.unpauseAnimations();
      }
    }, { threshold: 0.04 });
    observer.observe(root);
  }
})();
</script>
